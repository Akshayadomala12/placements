services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: placement-backend
    runtime: docker
    branch: main
    autoDeploy: true
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 10000

  # 2. React Vite Frontend Static Site
  - type: web
    name: placement-frontend
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: placement-backend
          property: host
